[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "review-rdk-logger"
dynamic = ["version"]
description = "Web UI and CLI to review RDK log bundles (.tgz): browse logs per device, compare them side by side and spot errors."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Uday Bhadauria" }]
dependencies = [
    "Flask>=3.0,<4",
    "cryptography>=41",
    "gunicorn>=22; sys_platform != 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
review-rdk-logger = "review_rdk_logger.cli:main"
review-rdk-web = "review_rdk_logger.web:main"

[project.urls]
Repository = "https://github.com/udaybhadauria/Review_LogFiles"

[tool.setuptools.dynamic]
version = { attr = "review_rdk_logger.__version__" }

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
review_rdk_logger = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
