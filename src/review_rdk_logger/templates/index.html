<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RDK Log Review</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%233b82f6'/><path d='M9 10h14M9 16h10M9 22h6' stroke='white' stroke-width='3' stroke-linecap='round'/></svg>" />
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css', v=version) }}" />
    <script>
      document.documentElement.dataset.theme =
        localStorage.getItem('theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
    </script>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <div>
          <h1>RDK Log Review <span class="version">v{{ version }}</span></h1>
          <p id="globalStats" class="muted">Loading…</p>
        </div>
      </div>
      <div class="topbar-actions">
        <div id="uploadProgress" class="upload-progress" hidden>
          <div class="upload-progress-bar"></div>
          <span class="upload-progress-label"></span>
        </div>
        <button id="sidebarToggleBtn" class="btn btn-icon" type="button" title="Toggle sidebar">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h18M3 6h18M3 18h18" /></svg>
        </button>
        <label class="btn btn-primary" for="fileInput" title="Upload .tgz bundles (or drop them anywhere)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4m0 0-4 4m4-4 4 4M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3" /></svg>
          Upload logs
        </label>
        <input id="fileInput" type="file" multiple accept=".tgz,.tar.gz,application/gzip" hidden />
        <button id="refreshBtn" class="btn btn-icon" type="button" title="Rescan archives">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7" /></svg>
        </button>
        <button id="themeBtn" class="btn btn-icon" type="button" title="Toggle light/dark theme">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z" /></svg>
        </button>
      </div>
    </header>

    <div class="layout">
      <aside class="sidebar">
        <section class="panel">
          <div class="panel-head">
            <h2>Device</h2>
            <span id="deviceCount" class="chip"></span>
          </div>
          <select id="deviceSelect" class="input" title="Select device">
            <option value="">Select a device…</option>
          </select>
        </section>

        <section class="panel">
          <div class="panel-head">
            <h2>Bundles</h2>
            <span id="archiveCount" class="chip"></span>
          </div>
          <div id="archiveList" class="archive-list"></div>
        </section>

        <section class="panel panel-grow">
          <div class="panel-head">
            <h2>Log files</h2>
            <span id="fileCount" class="chip"></span>
          </div>
          <div class="file-tools">
            <input id="fileSearch" class="input" type="search" placeholder="Filter files…  ( / )" autocomplete="off" />
            <div class="file-toggles">
              <label class="toggle"><input id="hideEmpty" type="checkbox" checked /> Hide empty</label>
              <label class="toggle"><input id="issuesOnly" type="checkbox" /> With issues</label>
              <select id="fileSort" class="input input-sm" title="Sort files">
                <option value="name">Name</option>
                <option value="issues">Most issues</option>
                <option value="size">Largest</option>
              </select>
            </div>
          </div>
          <div id="fileList" class="file-list"></div>
        </section>
      </aside>

      <main class="viewer">
        <div class="viewer-toolbar">
          <div class="muted" id="viewerHint">Open up to 4 logs to compare them side by side.</div>
          <div class="viewer-actions">
            <div class="segmented" role="group" aria-label="Columns">
              <button type="button" data-cols="1" title="One column">1</button>
              <button type="button" data-cols="2" title="Two columns">2</button>
              <button type="button" data-cols="3" title="Three columns">3</button>
            </div>
            <button id="closeAllBtn" class="btn btn-ghost" type="button">Close all</button>
          </div>
        </div>
        <div id="viewerGrid" class="viewer-grid"></div>
      </main>
    </div>

    <div id="dropOverlay" class="drop-overlay" hidden>
      <div class="drop-card">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4m0 0-4 4m4-4 4 4M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3" /></svg>
        <strong>Drop .tgz log bundles to upload</strong>
      </div>
    </div>
    <div id="toasts" class="toasts" aria-live="polite"></div>

    <template id="paneTemplate">
      <article class="pane">
        <header class="pane-head">
          <div class="pane-title">
            <strong class="pane-name"></strong>
            <span class="pane-path muted"></span>
          </div>
          <div class="pane-actions">
            <button class="btn btn-icon btn-sm" data-act="prev-issue" type="button" title="Previous error/warning">
              <svg viewBox="0 0 24 24"><path d="m6 15 6-6 6 6" /></svg>
            </button>
            <button class="btn btn-icon btn-sm" data-act="next-issue" type="button" title="Next error/warning">
              <svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6" /></svg>
            </button>
            <button class="btn btn-icon btn-sm" data-act="wrap" type="button" title="Toggle line wrap">
              <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h13a3 3 0 0 1 0 6h-4m0 0 2-2m-2 2 2 2M4 18h5" /></svg>
            </button>
            <a class="btn btn-icon btn-sm" data-act="download" title="Download file">
              <svg viewBox="0 0 24 24"><path d="M12 4v12m0 0-4-4m4 4 4-4M4 20h16" /></svg>
            </a>
            <button class="btn btn-icon btn-sm" data-act="close" type="button" title="Close">
              <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18" /></svg>
            </button>
          </div>
        </header>
        <div class="pane-tools">
          <div class="search-box">
            <input class="input input-sm pane-search" type="search" placeholder="Search (Enter / Shift+Enter)" autocomplete="off" />
            <span class="match-count muted"></span>
          </div>
          <label class="toggle"><input class="pane-only" type="checkbox" /> Only matches</label>
          <select class="input input-sm pane-level" title="Severity filter">
            <option value="all">All lines</option>
            <option value="issues">Warnings + errors</option>
            <option value="err">Errors only</option>
          </select>
        </div>
        <div class="pane-stats"></div>
        <div class="pane-body"><div class="log-lines"><div class="pane-message">Loading…</div></div></div>
      </article>
    </template>

    <script src="{{ url_for('static', filename='app.js', v=version) }}"></script>
  </body>
</html>
